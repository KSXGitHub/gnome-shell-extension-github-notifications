[package]
name = "gnome-shell-extension-github-notifications"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "gnome_shell_extension_github_notifications"
path = "rust-lib/lib.rs"

[[bin]]
name = "gnome-shell-extension-github-notifications"
path = "rust-bin/main.rs"

[[bin]]
name = "generate-typescript-definitions"
path = "rust-bin/bindings.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
derive_more = { version = "2.1.0", features = ["display"] }
pipe-trait = "0.4.0"
reqwest = { version = "0.12.24", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
text-block-macros = "0.2.0"
typescript-type-def = { version = "0.5.13", features = ["json_value"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
